<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B3752"/>
      <stop offset="60%" stop-color="#3d5a7a"/>
      <stop offset="100%" stop-color="#5a7fa0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5c30"/>
      <stop offset="100%" stop-color="#24402C"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a3a"/>
      <stop offset="100%" stop-color="#5A3A30"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3A30"/>
      <stop offset="100%" stop-color="#3d2820"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#00000040"/>
    </filter>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E3A72E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E3A72E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="900" height="500" fill="url(#sky)"/>

  <!-- Sun / glow -->
  <circle cx="750" cy="100" r="55" fill="url(#sunGlow)"/>
  <circle cx="750" cy="100" r="32" fill="#E3A72E" opacity="0.95"/>
  <circle cx="750" cy="100" r="22" fill="#f0c04a"/>

  <!-- Distant Sahyadri hills -->
  <path d="M0,320 C100,260 200,220 300,230 C380,238 420,210 500,205
           C580,200 640,230 720,235 C800,240 860,215 900,220 L900,500 L0,500 Z"
        fill="#1a2e1f" opacity="0.7"/>
  <path d="M0,360 C80,310 180,280 280,285 C360,290 420,260 490,255
           C560,250 630,270 700,278 C780,286 860,265 900,270 L900,500 L0,500 Z"
        fill="#24402C" opacity="0.85"/>

  <!-- Ground / campus lawn -->
  <ellipse cx="450" cy="470" rx="450" ry="60" fill="url(#ground)"/>
  <rect x="0" y="440" width="900" height="60" fill="#24402C"/>
  <!-- Path / driveway -->
  <path d="M380,500 L420,360 L480,360 L520,500 Z" fill="#c4a98a" opacity="0.5"/>
  <path d="M420,360 L480,360 L475,380 L425,380 Z" fill="#E3A72E" opacity="0.4"/>

  <!-- ── MAIN SCHOOL BUILDING ─────────────────────────────── -->
  <!-- Central block -->
  <rect x="270" y="200" width="360" height="200" fill="url(#wallGrad)" filter="url(#shadow)"/>
  <!-- Roof / parapet -->
  <rect x="260" y="188" width="380" height="18" fill="url(#roofGrad)"/>
  <!-- Crenellation on parapet -->
  <g fill="#3d2820">
    <rect x="270" y="180" width="14" height="12"/>
    <rect x="292" y="180" width="14" height="12"/>
    <rect x="314" y="180" width="14" height="12"/>
    <rect x="336" y="180" width="14" height="12"/>
    <rect x="358" y="180" width="14" height="12"/>
    <rect x="380" y="180" width="14" height="12"/>
    <rect x="402" y="180" width="14" height="12"/>
    <rect x="424" y="180" width="14" height="12"/>
    <rect x="446" y="180" width="14" height="12"/>
    <rect x="468" y="180" width="14" height="12"/>
    <rect x="490" y="180" width="14" height="12"/>
    <rect x="512" y="180" width="14" height="12"/>
    <rect x="534" y="180" width="14" height="12"/>
    <rect x="556" y="180" width="14" height="12"/>
    <rect x="578" y="180" width="14" height="12"/>
    <rect x="600" y="180" width="14" height="12"/>
  </g>
  <!-- Gold trim band -->
  <rect x="260" y="205" width="380" height="5" fill="#E3A72E" opacity="0.85"/>

  <!-- Entrance arch / gate portal -->
  <rect x="390" y="300" width="120" height="100" fill="#3d2820"/>
  <path d="M390,300 Q450,255 510,300 Z" fill="#3d2820"/>
  <!-- Arch keystone detail -->
  <polygon points="450,262 460,280 440,280" fill="#E3A72E" opacity="0.8"/>

  <!-- Entrance steps -->
  <rect x="380" y="394" width="140" height="10" fill="#7a5a4a" opacity="0.7"/>
  <rect x="390" y="404" width="120" height="10" fill="#7a5a4a" opacity="0.5"/>
  <rect x="400" y="414" width="100" height="26" fill="#7a5a4a" opacity="0.4"/>

  <!-- School name plaque above arch -->
  <rect x="396" y="266" width="108" height="22" rx="3" fill="#E3A72E" opacity="0.9"/>
  <text x="450" y="281" text-anchor="middle" font-family="serif" font-size="9" fill="#3d2820" font-weight="bold">RAIGAD INT'L SCHOOL</text>

  <!-- Windows — ground floor -->
  <g fill="#2B3752" stroke="#E3A72E" stroke-width="1.5">
    <rect x="290" y="320" width="60" height="70" rx="3"/>
    <rect x="370" y="320" width="16" height="70" rx="2"/><!-- mullion -->
    <rect x="550" y="320" width="60" height="70" rx="3"/>
    <rect x="614" y="320" width="16" height="70" rx="2"/>
  </g>
  <!-- Windows — upper floor -->
  <g fill="#2B3752" stroke="#E3A72E" stroke-width="1.5">
    <rect x="290" y="220" width="50" height="60" rx="3"/>
    <rect x="356" y="220" width="50" height="60" rx="3"/>
    <rect x="504" y="220" width="50" height="60" rx="3"/>
    <rect x="570" y="220" width="50" height="60" rx="3"/>
  </g>

  <!-- ── LEFT WING ──────────────────────────────────────────── -->
  <rect x="110" y="250" width="170" height="150" fill="url(#wallGrad)" opacity="0.9" filter="url(#shadow)"/>
  <rect x="100" y="240" width="190" height="14" fill="url(#roofGrad)"/>
  <!-- Wing windows -->
  <g fill="#2B3752" stroke="#E3A72E" stroke-width="1.2">
    <rect x="126" y="270" width="44" height="55" rx="2"/>
    <rect x="182" y="270" width="44" height="55" rx="2"/>
    <rect x="126" y="340" width="44" height="45" rx="2"/>
    <rect x="182" y="340" width="44" height="45" rx="2"/>
  </g>

  <!-- ── RIGHT WING ─────────────────────────────────────────── -->
  <rect x="620" y="250" width="170" height="150" fill="url(#wallGrad)" opacity="0.9" filter="url(#shadow)"/>
  <rect x="610" y="240" width="190" height="14" fill="url(#roofGrad)"/>
  <g fill="#2B3752" stroke="#E3A72E" stroke-width="1.2">
    <rect x="636" y="270" width="44" height="55" rx="2"/>
    <rect x="692" y="270" width="44" height="55" rx="2"/>
    <rect x="636" y="340" width="44" height="45" rx="2"/>
    <rect x="692" y="340" width="44" height="45" rx="2"/>
  </g>

  <!-- ── FLAGPOLE ────────────────────────────────────────────── -->
  <rect x="448" y="120" width="4" height="70" fill="#c4a98a"/>
  <polygon points="452,120 480,130 452,142" fill="#E3A72E"/>

  <!-- ── TREES / GREENERY ───────────────────────────────────── -->
  <!-- Left trees -->
  <ellipse cx="80"  cy="390" rx="30" ry="45" fill="#24402C"/>
  <ellipse cx="80"  cy="370" rx="22" ry="32" fill="#2e5a35"/>
  <rect x="77" y="420" width="6" height="30" fill="#5a3a25"/>
  <ellipse cx="40"  cy="400" rx="24" ry="36" fill="#1e3a25"/>
  <ellipse cx="40"  cy="385" rx="18" ry="25" fill="#24402C"/>
  <rect x="37" y="425" width="6" height="25" fill="#5a3a25"/>

  <!-- Right trees -->
  <ellipse cx="820" cy="390" rx="30" ry="45" fill="#24402C"/>
  <ellipse cx="820" cy="370" rx="22" ry="32" fill="#2e5a35"/>
  <rect x="817" y="420" width="6" height="30" fill="#5a3a25"/>
  <ellipse cx="860" cy="400" rx="24" ry="36" fill="#1e3a25"/>
  <ellipse cx="860" cy="385" rx="18" ry="25" fill="#24402C"/>
  <rect x="857" y="425" width="6" height="25" fill="#5a3a25"/>

  <!-- Decorative bushes along front -->
  <ellipse cx="150" cy="442" rx="28" ry="16" fill="#2e5a35"/>
  <ellipse cx="215" cy="445" rx="22" ry="13" fill="#24402C"/>
  <ellipse cx="690" cy="442" rx="28" ry="16" fill="#2e5a35"/>
  <ellipse cx="750" cy="445" rx="22" ry="13" fill="#24402C"/>

  <!-- ── FLOATING ACCENT ICONS ─────────────────────────────── -->
  <!-- Mortarboard top-left -->
  <g transform="translate(60,60)" opacity="0.8">
    <rect x="-15" y="0" width="30" height="6" rx="1" fill="#E3A72E"/>
    <polygon points="0,-12 -18,0 18,0" fill="#E3A72E"/>
    <line x1="15" y1="2" x2="20" y2="14" stroke="#E3A72E" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="2.5" fill="#E3A72E"/>
  </g>

  <!-- Book top area -->
  <g transform="translate(820,55)" opacity="0.75">
    <rect x="-18" y="-12" width="36" height="24" rx="2" fill="none" stroke="#E3A72E" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#E3A72E" stroke-width="1.5"/>
    <line x1="-12" y1="-4" x2="-2" y2="-4" stroke="#E3A72E" stroke-width="1" opacity="0.6"/>
    <line x1="-12" y1="2" x2="-2" y2="2" stroke="#E3A72E" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Kite -->
  <g transform="translate(165,80)" opacity="0.7">
    <polygon points="0,-20 14,0 0,20 -14,0" fill="none" stroke="#E3A72E" stroke-width="1.8"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#E3A72E" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="0" x2="14" y2="0" stroke="#E3A72E" stroke-width="1" opacity="0.4"/>
    <path d="M0,20 Q8,32 4,42" stroke="#E3A72E" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Stars/sparkles in sky -->
  <g fill="#F7F4EC" opacity="0.6">
    <circle cx="200" cy="60"  r="1.5"/>
    <circle cx="350" cy="40"  r="1"/>
    <circle cx="500" cy="55"  r="1.5"/>
    <circle cx="620" cy="35"  r="1"/>
    <circle cx="680" cy="70"  r="1.5"/>
    <circle cx="120" cy="90"  r="1"/>
    <circle cx="800" cy="150" r="1"/>
    <circle cx="850" cy="80"  r="1.5"/>
    <circle cx="280" cy="80"  r="1"/>
    <circle cx="580" cy="90"  r="1"/>
  </g>

  <!-- Cloud wisps -->
  <g fill="white" opacity="0.15">
    <ellipse cx="150" cy="115" rx="55" ry="18"/>
    <ellipse cx="190" cy="110" rx="35" ry="12"/>
    <ellipse cx="640" cy="130" rx="65" ry="20"/>
    <ellipse cx="680" cy="125" rx="40" ry="14"/>
  </g>
</svg>
