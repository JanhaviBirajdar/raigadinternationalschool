<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120" preserveAspectRatio="none">
  <!-- Sahyadri hill skyline + Raigad fort ramparts ridge-line divider -->
  <!-- Background sky wash -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B3752" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F7F4EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24402C"/>
      <stop offset="100%" stop-color="#1a2e1f"/>
    </linearGradient>
    <linearGradient id="fortGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3A30"/>
      <stop offset="100%" stop-color="#3d2820"/>
    </linearGradient>
  </defs>

  <!-- Sky fill -->
  <rect width="1440" height="120" fill="url(#skyGrad)"/>

  <!-- Distant Sahyadri hills — rolling silhouette -->
  <path d="M0,90 C80,70 160,50 240,55 C320,60 380,45 460,40 C540,35 600,50 680,48
           C760,46 820,30 900,28 C980,26 1040,42 1120,45 C1200,48 1280,35 1360,40 L1440,38
           L1440,120 L0,120 Z"
        fill="url(#hillGrad)" opacity="0.55"/>

  <!-- Mid-range hills + small fort watchtower silhouette -->
  <path d="M0,105 C60,95 120,80 200,78 C240,77 260,65 270,60 L272,50 L275,60
           C280,64 300,72 360,75 C440,78 500,70 560,68 C580,67 595,55 600,48
           L603,40 L605,36 L607,40 L610,48 L616,55 C630,68 680,72 720,74
           C800,78 860,65 920,62 C940,61 958,50 962,44 L964,38 L967,44
           L970,52 C985,65 1040,72 1100,75 C1180,79 1260,68 1320,70
           C1380,72 1420,85 1440,90
           L1440,120 L0,120 Z"
        fill="url(#fortGrad)" opacity="0.75"/>

  <!-- Fort rampart crenellations (merlons) — laterite stone row -->
  <g fill="#5A3A30" opacity="0.9">
    <!-- Rampart base line -->
    <rect x="0" y="108" width="1440" height="12"/>
    <!-- Merlons (battlements) spaced across -->
    <rect x="30"   y="98" width="18" height="12"/>
    <rect x="62"   y="98" width="18" height="12"/>
    <rect x="94"   y="98" width="18" height="12"/>
    <rect x="140"  y="96" width="20" height="14"/>
    <rect x="175"  y="96" width="20" height="14"/>
    <rect x="210"  y="96" width="20" height="14"/>
    <rect x="270"  y="94" width="22" height="16"/>
    <rect x="308"  y="94" width="22" height="16"/>
    <rect x="346"  y="94" width="22" height="16"/>
    <rect x="400"  y="96" width="20" height="14"/>
    <rect x="435"  y="96" width="20" height="14"/>
    <rect x="470"  y="96" width="20" height="14"/>
    <rect x="540"  y="97" width="18" height="13"/>
    <rect x="573"  y="97" width="18" height="13"/>
    <rect x="606"  y="93" width="22" height="17"/>
    <rect x="643"  y="93" width="22" height="17"/>
    <rect x="680"  y="93" width="22" height="17"/>
    <rect x="740"  y="96" width="20" height="14"/>
    <rect x="775"  y="96" width="20" height="14"/>
    <rect x="810"  y="96" width="20" height="14"/>
    <rect x="870"  y="94" width="22" height="16"/>
    <rect x="908"  y="94" width="22" height="16"/>
    <rect x="946"  y="94" width="22" height="16"/>
    <rect x="1000" y="96" width="20" height="14"/>
    <rect x="1035" y="96" width="20" height="14"/>
    <rect x="1070" y="96" width="20" height="14"/>
    <rect x="1130" y="97" width="18" height="13"/>
    <rect x="1163" y="97" width="18" height="13"/>
    <rect x="1196" y="93" width="22" height="17"/>
    <rect x="1233" y="93" width="22" height="17"/>
    <rect x="1270" y="96" width="20" height="14"/>
    <rect x="1310" y="96" width="20" height="14"/>
    <rect x="1360" y="95" width="22" height="15"/>
    <rect x="1398" y="95" width="22" height="15"/>
  </g>

  <!-- Marigold gold trim line -->
  <rect x="0" y="107" width="1440" height="2" fill="#E3A72E" opacity="0.7"/>
</svg>
